name: CI Security

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend_quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/backend/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Type-check backend
        run: npm run type-check

      - name: Build backend
        run: npm run build

      - name: Run bookings service tests
        run: npm run test:bookings

  mobile_quality:
    name: Mobile Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile deps
        run: npm ci

      - name: Type-check mobile
        run: npm run type-check

  admin_quality:
    name: Admin Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Cache admin TS build artifacts
        uses: actions/cache@v4
        with:
          path: |
            apps/admin/dist
            apps/admin/*.tsbuildinfo
          key: ${{ runner.os }}-admin-build-${{ hashFiles('apps/admin/package-lock.json', 'apps/admin/tsconfig*.json', 'apps/admin/vite.config.*', 'apps/admin/src/**/*.{ts,tsx,css}') }}
          restore-keys: |
            ${{ runner.os }}-admin-build-${{ hashFiles('apps/admin/package-lock.json', 'apps/admin/tsconfig*.json', 'apps/admin/vite.config.*') }}-
            ${{ runner.os }}-admin-build-

      - name: Install admin deps
        run: npm ci

      - name: Lint admin
        run: npm run lint

      - name: Type-check admin (standalone tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build admin
        run: npm run build

  secret_scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency_audit:
    name: Dependency Audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            working_directory: packages/backend
            lockfile: packages/backend/package-lock.json
          - name: admin
            working_directory: apps/admin
            lockfile: apps/admin/package-lock.json
          - name: mobile
            working_directory: apps/mobile
            lockfile: apps/mobile/package-lock.json
    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: |
          if [ "${{ matrix.name }}" = "admin" ]; then
            # Admin uses BrowserRouter + plain axios; several React Router HIGH advisories
            # apply only to RSC/Actions/SSR features which are unreachable.
            # scripts/audit-ci.mjs allows the reviewed RSC-only list and fails on any
            # CRITICAL advisory or any HIGH advisory outside that allowlist.
            npm run audit:ci
          else
            npm audit --omit=dev --audit-level=high
          fi
